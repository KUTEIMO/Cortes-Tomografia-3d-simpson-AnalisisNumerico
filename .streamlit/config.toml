[server]
headless = true
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 100
runOnSave = false
allowRunOnSave = false

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F8F9FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#101828"
font = "sans serif"
